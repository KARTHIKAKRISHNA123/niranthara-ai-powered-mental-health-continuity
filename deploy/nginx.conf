server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom owns /dashboard, /patient/:uid and /alerts. Without this
    # fallback a hard refresh on /patient/abc123 asks nginx for a file that does
    # not exist and returns 404 — the classic SPA deep-link break.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable; index.html must never be cached or
    # clients keep booting the previous deploy's bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
