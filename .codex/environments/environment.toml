version = 1
name = "Niranthara-AI-Powered-Mental-Health-Continuity-1"

[setup]
script = ""

[setup.win32]
script = '''
cd "$CODEX_WORKTREE_PATH"

echo "==> Installing backend dependencies"
if [ -d "backend" ]; then
  cd backend
  npm install
  cd ..
fi

echo "==> Installing dashboard dependencies"
if [ -d "dashboard" ]; then
  cd dashboard
  npm install
  cd ..
fi

echo "==> Installing mobile dependencies"
if [ -d "mobile-app" ]; then
  cd mobile-app
  npm install
  cd ..
fi

echo "==> Setting up AI service (Python)"
if [ -d "ai-service" ]; then
  cd ai-service

  python3 -m venv venv
  source venv/bin/activate

  pip install --upgrade pip
  pip install -r requirements.txt

  cd ..
fi

echo "==> Setup complete"
'''

[cleanup]
script = ""

[cleanup.win32]
script = '''
rm -rf backend/node_modules
rm -rf dashboard/node_modules
rm -rf mobile-app/node_modules
rm -rf ai-service/venv
'''

[[actions]]
